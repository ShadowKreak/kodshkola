{% extends "base.html" %}
{% from "_m.html" import csrf with context %}
{% block title %}Профиль{% endblock %}
{% block content %}
<div class="page-head"><div><h1>Профиль</h1><p class="sub">{{ role_name }} · {{ current_user['email'] }}</p></div></div>
<div class="grid grid-2">
  <form class="card" method="post">
    {{ csrf() }}<input type="hidden" name="action" value="name">
    <div class="card-head"><h2>Личные данные</h2></div>
    <div class="field"><label for="full_name">Имя и фамилия</label>
      <input id="full_name" name="full_name" type="text" value="{{ current_user['full_name'] }}" maxlength="80" required></div>
    <div class="field"><label>Электронная почта</label><input type="email" value="{{ current_user['email'] }}" disabled></div>
    <button class="btn" type="submit">Сохранить</button>
  </form>
  <form class="card" method="post">
    {{ csrf() }}<input type="hidden" name="action" value="password">
    <div class="card-head"><h2>Смена пароля</h2></div>
    <div class="field"><label for="old_password">Текущий пароль</label>
      <input id="old_password" name="old_password" type="password" autocomplete="current-password" required></div>
    <div class="field"><label for="new_password">Новый пароль</label>
      <input id="new_password" name="new_password" type="password" autocomplete="new-password" minlength="8" required>
      <div class="hint">Минимум 8 символов, буквы и цифры.</div></div>
    <button class="btn" type="submit">Изменить пароль</button>
  </form>
</div>
{% endblock %}
